name: 问题反馈
description: 使用 CNShadow 时遇到问题，请选择此项
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把信息填完整，方便快速定位问题。

  - type: input
    id: vscode-version
    attributes:
      label: VS Code 版本
      description: 帮助 → 关于 里可以看到
      placeholder: 例如 1.95.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: lang
    attributes:
      label: 涉及的文件类型
      options:
        - TypeScript
        - JavaScript
        - Python
        - 其它 / 不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述，越具体越好
      placeholder: |
        1. 打开 xxx.ts
        2. 按 Ctrl+Alt+L 切到中文视图
        3. 输入 ...
        4. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图更好；如果是报错，请把「输出 → CNShadow」里的日志贴上来
    validations:
      required: true

  - type: textarea
    id: cnmap
    attributes:
      label: 相关映射（可选）
      description: 如果与自定义别名有关，请贴出 .cnmap 里对应的片段
      render: json
    validations:
      required: false
