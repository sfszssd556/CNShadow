name: 构建与发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 编译
        run: npm run compile

      - name: 打包 VSIX
        run: npx --yes @vscode/vsce package

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cnshadow-vsix
          path: '*.vsix'

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

      - name: 发布到 VS Code 扩展市场（可选）
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath ./*.vsix -p "$VSCE_PAT"
          else
            echo "未配置 VSCE_PAT，跳过扩展市场发布"
          fi
